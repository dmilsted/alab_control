<div class="form-card">
    <h1 class="main-title">Machine Test</h1>
</div>
<div class="form-card">
    <h2 class="main-subtitle">Communication tests</h2>
    <div class="button-group">
        <button class="btn btn-primary" data-function="c3dp_test_connectivity_machine_test_page"
            id="button1">3D-Printer: <br /><br /> test connectivity</button>
        <button class="btn btn-primary" data-function="control_panel_get_macstat" data-id="button2">Control panel:
            <br /><br />send "MACSTAT"</button>
        <button class="btn btn-primary" data-function="server_test_connectivity" data-id="button3">Server: <br /><br />
            send "ping"</button>
    </div>
</div>
<div class="form-card">
    <h2 class="main-subtitle">Manual Use</h2>
    <div class="button-group">
        <button class="btn btn-primary" data-function="device_extend_bed" id="button4">Extend bed</button>
        <button class="btn btn-primary" data-function="device_retract_bed" id="button5">Retract bed</button>
        <button class="btn btn-primary" data-function="control_panel_sem_stage_open" data-id="button6">Uncover SEM
            stage</button>
        <button class="btn btn-primary" data-function="control_panel_sem_stage_close" data-id="button7">Cover SEM
            stage</button>
        <button class="btn btn-primary" data-function="control_panel_gripper_close" data-id="button8">Close gripper</button>
        <button class="btn btn-primary" data-function="control_panel_gripper_home" data-id="button9">Open gripper</button>
        <button class="btn btn-primary" data-function="control_panel_tem_grid_holder_open" data-id="button10">Open TEM
            grid cover</button>
        <button class="btn btn-primary" data-function="control_panel_tem_grid_holder_close" data-id="button11">Close TEM
            grid cover</button>
    </div>
    <div class="button-group">
        <button class="btn btn-primary" data-function="control_panel_standby" data-id="button12">Control panel:
            <br /><br /> send "standby"</button>
        <button class="btn btn-primary" data-function="control_panel_shutdown" data-id="button13">Control panel:
            <br /><br />send "shutdown"</button>
        <button class="btn btn-secondary" onclick="window.open('/advanced_control', '_blank')" id="advanced-control-btn">Advanced Manual Control
            <br /><br />(opens new tab)</button>
    </div>
</div>
<div class="form-card">
    <h2 class="main-subtitle">Maintenance tests</h2>
    <div class="button-group">
        <button class="btn btn-primary" onclick="window.location.href='/soak_tests'" id="soak-tests-btn">Soak Tests</button>
        <button class="btn btn-primary" data-function="None" id="button15">Other tests?</button>
        <button class="btn btn-primary" onclick="window.open('http://localhost:8000/stats', '_blank')" id="button16">System Statistics</button>
    </div>
</div>
